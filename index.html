<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Bhabhi ✨</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ============================================
       PAGE 1 — LANDING
       Cherry Blossom Tree + Moonlit Sky
       ============================================ */

    body { overflow: hidden; }

    /* ---- HERO SECTION ---- */
    #hero {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Radial deep blue sky gradient */
    #hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, #0e1e3f 0%, #070d1a 50%, #030508 100%);
      z-index: 0;
    }

    /* Moon glow */
    .moon {
      position: absolute;
      top: 8%; right: 18%;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8e7, #f5e190 40%, #c9a84c 80%);
      box-shadow:
        0 0 40px 20px rgba(201,168,76,0.25),
        0 0 100px 60px rgba(201,168,76,0.1),
        0 0 200px 100px rgba(201,168,76,0.06);
      animation: moon-pulse 6s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes moon-pulse {
      0%,100% { box-shadow: 0 0 40px 20px rgba(201,168,76,0.25), 0 0 100px 60px rgba(201,168,76,0.1); }
      50% { box-shadow: 0 0 60px 30px rgba(201,168,76,0.35), 0 0 150px 80px rgba(201,168,76,0.18); }
    }

    /* Floating lanterns */
    .lantern {
      position: absolute;
      width: 18px; height: 26px;
      border-radius: 50% 50% 40% 40%;
      border: 1px solid rgba(201,168,76,0.6);
      z-index: 3;
      animation: float-up var(--dur, 12s) ease-in-out infinite var(--delay, 0s);
    }
    .lantern::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      background: radial-gradient(circle at 40% 35%, rgba(255,220,80,0.9), rgba(201,168,76,0.4));
      box-shadow: 0 0 12px rgba(255,200,60,0.8), 0 0 30px rgba(201,168,76,0.4);
    }
    .lantern::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 50%;
      transform: translateX(-50%);
      width: 1px; height: 8px;
      background: rgba(201,168,76,0.5);
    }
    @keyframes float-up {
      0%   { transform: translateY(0) translateX(0); opacity: 0.9; }
      25%  { transform: translateY(-30vh) translateX(15px); opacity: 1; }
      50%  { transform: translateY(-55vh) translateX(-10px); opacity: 0.8; }
      75%  { transform: translateY(-75vh) translateX(12px); opacity: 0.5; }
      100% { transform: translateY(-95vh) translateX(-5px); opacity: 0; }
    }

    /* SVG Cherry Blossom Tree */
    #tree-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      max-width: 95vw;
      z-index: 4;
    }
    #tree-svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 30px rgba(244,184,200,0.3));
    }
    /* Swaying branch animation */
    .branch-group {
      transform-origin: 350px 620px;
      animation: sway 6s ease-in-out infinite;
    }
    .branch-group.left { animation-delay: -2s; animation-name: sway-left; }
    @keyframes sway {
      0%,100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
    }
    @keyframes sway-left {
      0%,100% { transform: rotate(0deg); }
      50% { transform: rotate(-1.5deg); }
    }

    /* ---- HERO TEXT ---- */
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 20px;
      margin-top: -80px;
    }

    .tagline {
      font-family: var(--font-body);
      font-weight: 200;
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--pink-soft);
      margin-bottom: 16px;
      opacity: 0;
      animation: fade-drop 1s ease forwards 3.5s;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 7vw, 6.5rem);
      font-weight: 300;
      line-height: 1.05;
      margin-bottom: 8px;
      opacity: 0;
      animation: fade-drop 1.2s ease forwards 3.8s;
    }
    .main-title em {
      font-style: italic;
      display: block;
      font-size: clamp(3.2rem, 8vw, 7.5rem);
      font-weight: 600;
    }

    .subtitle {
      font-family: var(--font-script);
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      color: rgba(248,240,232,0.7);
      font-weight: 400;
      margin: 20px 0 44px;
      line-height: 1.6;
      opacity: 0;
      animation: fade-drop 1s ease forwards 4.2s;
    }

    @keyframes fade-drop {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Enter button */
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 44px;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.5);
      border-radius: 50px;
      color: var(--gold-light);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: none;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fade-drop 1s ease forwards 4.6s;
      transition: all 0.5s ease;
      box-shadow: 0 0 30px rgba(201,168,76,0.1), inset 0 0 30px rgba(201,168,76,0.03);
    }
    .enter-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.12), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .enter-btn:hover::before { transform: translateX(100%); }
    .enter-btn:hover {
      border-color: var(--gold-light);
      box-shadow: 0 0 50px rgba(201,168,76,0.3), 0 0 100px rgba(201,168,76,0.1);
      color: var(--gold-glow);
      transform: translateY(-3px);
    }
    .enter-btn .arrow {
      width: 20px; height: 1px;
      background: var(--gold-light);
      position: relative;
      transition: width 0.3s ease;
    }
    .enter-btn .arrow::after {
      content: '';
      position: absolute;
      right: 0; top: -3px;
      width: 7px; height: 7px;
      border-right: 1px solid var(--gold-light);
      border-top: 1px solid var(--gold-light);
      transform: rotate(45deg);
    }
    .enter-btn:hover .arrow { width: 32px; }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fade-drop 1s ease forwards 5.2s;
    }
    .scroll-indicator span {
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(248,240,232,0.35);
      font-family: var(--font-body);
      font-weight: 300;
    }
    .scroll-mouse {
      width: 24px; height: 38px;
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 6px;
    }
    .scroll-wheel {
      width: 3px; height: 8px;
      background: var(--gold-light);
      border-radius: 2px;
      animation: scroll-wheel 1.8s ease-in-out infinite;
      box-shadow: 0 0 6px var(--gold-light);
    }
    @keyframes scroll-wheel {
      0% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(14px); opacity: 0; }
      100% { transform: translateY(0); opacity: 0; }
    }

    /* Sparkle particles */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 8;
      font-size: 1rem;
      animation: sparkle-float var(--s-dur, 4s) ease-in-out infinite var(--s-delay, 0s);
      color: var(--gold-light);
      text-shadow: 0 0 10px var(--gold-glow);
    }
    @keyframes sparkle-float {
      0%,100% { transform: translate(0,0) scale(1); opacity: 0.6; }
      25% { transform: translate(10px,-15px) scale(1.2); opacity: 1; }
      50% { transform: translate(-8px,-25px) scale(0.9); opacity: 0.8; }
      75% { transform: translate(12px,-10px) scale(1.1); opacity: 0.9; }
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 600px) {
      .moon { width: 60px; height: 60px; top: 6%; right: 10%; }
      #tree-container { width: 100vw; }
      .hero-content { margin-top: -40px; }
    }
  </style>
</head>
